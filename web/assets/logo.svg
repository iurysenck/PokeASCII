<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12352c"/>
      <stop offset="70%" stop-color="#071318"/>
      <stop offset="100%" stop-color="#03070a"/>
    </radialGradient>
    <linearGradient id="topBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#b81414"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28f0a0"/>
      <stop offset="100%" stop-color="#20c8ff"/>
    </linearGradient>
  </defs>

  <!-- Fundo Circular Holográfico AR -->
  <circle cx="256" cy="256" r="244" fill="url(#bgGlow)" stroke="url(#neonCyan)" stroke-width="8"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#28f0a0" stroke-width="2" stroke-dasharray="10 8" opacity="0.55"/>

  <!-- Grade de Perspectiva 3D do Chão AR -->
  <g stroke="#28f0a0" stroke-width="1.8" opacity="0.35" fill="none">
    <ellipse cx="256" cy="390" rx="170" ry="42"/>
    <ellipse cx="256" cy="390" rx="115" ry="26"/>
    <line x1="86" y1="390" x2="426" y2="390"/>
    <line x1="256" y1="348" x2="256" y2="432"/>
  </g>

  <!-- Pokébola 3D Estilizada com Malha Wireframe + Caracteres ASCII -->
  <path d="M 106 242 A 150 150 0 0 1 406 242 Z" fill="url(#topBall)" stroke="#ff9e9e" stroke-width="4"/>
  <path d="M 106 270 A 150 150 0 0 0 406 270 Z" fill="#e8f8f5" stroke="#28f0a0" stroke-width="4"/>
  <rect x="102" y="238" width="308" height="36" rx="8" fill="#091318" stroke="#28f0a0" stroke-width="3"/>

  <!-- Textura ASCII Sobreposta na Pokébola -->
  <g font-family="Consolas, monospace" font-weight="bold" font-size="20" text-anchor="middle">
    <text x="256" y="138" fill="#ffd8d8" opacity="0.85">/ # @ % * + = - \</text>
    <text x="256" y="168" fill="#ffffff" opacity="0.90">| @ # POKEMON # @ |</text>
    <text x="256" y="198" fill="#ffd24c" opacity="0.95">* [ ASCII-3D AR ] *</text>
    <text x="256" y="330" fill="#0b2822" opacity="0.80">\ + : . - = + * /</text>
    <text x="256" y="360" fill="#0b2822" opacity="0.85">| / \ | - | / \ |</text>
  </g>

  <!-- Botão Central Holográfico -->
  <circle cx="256" cy="256" r="46" fill="#08161c" stroke="url(#neonCyan)" stroke-width="6"/>
  <circle cx="256" cy="256" r="26" fill="#eafff8"/>
  <text x="256" y="263" font-family="Consolas, monospace" font-weight="bold" font-size="22" fill="#071814" text-anchor="middle">3D</text>

  <!-- Retículo de Ancoragem KLT '+' nos 4 cantos -->
  <g font-family="Consolas, monospace" font-weight="bold" font-size="28" fill="#28f0a0">
    <text x="95" y="125">+</text>
    <text x="398" y="125">+</text>
    <text x="95" y="405">+</text>
    <text x="398" y="405">+</text>
  </g>
</svg>
