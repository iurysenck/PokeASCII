name: Deploy PokeASCII 3D AR to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web directory as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"

      - name: Deploy to GitHub Pages (HTTPS Oficial p/ iPhone, Android e PC)
        id: deployment
        uses: actions/deploy-pages@v4
